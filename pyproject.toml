[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # Long SQL queries, Arabic UI copy, and embedded HTML/JS templates
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests set required env vars (DATABASE_URL, ENCRYPTION_KEY, OWNER_TELEGRAM_ID) before importing app modules
"tests/*" = ["E402", "E501"]
# Facade module intentionally re-exports public scraper symbols
"lms_scraper.py" = ["F401", "F403"]

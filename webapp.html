<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2457a7">
<title>دفتر الطالب | جامعة مؤتة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--paper:#f4f7fb;--surface:#fff;--ink:#1e2d43;--muted:#718096;--line:#e3e9f2;--teal:#2457a7;--teal-pale:#eaf1fc;--amber:#a66a12;--amber-pale:#fff4df;--red:#b54746;--red-pale:#fceeed;--shadow:0 8px 24px rgba(37,65,110,.055)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.shell{max-width:1260px;margin:auto;padding:0 25px}
.top{height:70px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);display:flex;align-items:center;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.top-inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.mark{width:38px;height:38px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0}
.brand strong{display:block;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:10px}
.right-head{display:flex;align-items:center;gap:9px}
.sync{font-size:11px;color:var(--muted);margin-inline:7px}
.sync b{color:var(--teal)}
.sync.paused b{color:var(--red)}
.btn,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover,.icon-btn:hover{background:#f8fafd}
.btn:disabled,.icon-btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:#1d488c}
.btn-danger{background:var(--red-pale);border-color:#f3d2d1;color:var(--red)}
.icon-btn{width:35px;height:35px;padding:0;font-size:17px;position:relative;display:inline-grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#e7eef9;color:#365b94;display:grid;place-items:center;font-weight:700;cursor:pointer;user-select:none}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:29px;padding-top:23px;padding-bottom:65px}
.side{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.side-label{font-size:10px;color:#9aa19e;letter-spacing:.06em;margin:4px 12px 9px}
.nav{display:grid;gap:3px}
.nav button{border:0;background:transparent;text-align:right;padding:9px 11px;border-radius:8px;color:#65716f;display:flex;align-items:center;gap:9px;width:100%;font-size:12px}
.nav button:hover{background:#eef3f9}
.nav button.active{background:var(--teal-pale);color:var(--teal);font-weight:600}
.nav .ico{width:18px;text-align:center;font-size:15px}
.nav .count{margin-right:auto;background:#f0f3ef;padding:2px 6px;border-radius:20px;font-size:10px}
.semester{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#ffffff8c}
.semester small{color:var(--muted);font-size:10px}
.semester strong{display:block;font-size:12px;margin-top:4px}
.content{min-width:0}
.page{display:none}
.page.active{display:block;animation:appear .16s ease}
@keyframes appear{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
.welcome{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.welcome h1,.page-title h1{font-size:23px;letter-spacing:-.3px;margin:0 0 3px;font-weight:600}
.welcome p,.page-title p{margin:0;color:var(--muted);font-size:12px}
.today{color:var(--muted);font-size:11px;padding-bottom:4px}
.page-title{margin-bottom:16px}
.page-title p{line-height:1.7}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:var(--shadow)}
.urgent{border-color:#eee6d8;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.urgent:before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#d99b3e}
.eyebrow{font-size:10px;color:var(--amber);font-weight:600;margin-bottom:5px}
.urgent h2{font-size:15px;margin:0 0 3px;font-weight:600}
.urgent p{font-size:11px;color:var(--muted);margin:0}
.due{display:inline-flex;align-items:center;gap:5px;margin-top:9px;color:#805619;background:var(--amber-pale);padding:4px 8px;border-radius:6px;font-size:10px}
.due.late{background:var(--red-pale);color:var(--red)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:8px}
.section-head h2{font-size:15px;margin:0;font-weight:600}
.section-head button,.text-link{font-size:11px;color:var(--teal);text-decoration:none;background:none;border:0;padding:0;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:#c6d5ec}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.stat-icon{color:var(--teal);background:var(--teal-pale);width:25px;height:25px;border-radius:7px;display:grid;place-items:center}
.stat strong{font-size:20px;display:block;margin:5px 0 1px;font-weight:600}
.stat small{color:var(--muted);font-size:10px}
.course-list,.task-list,.notice-list,.file-list,.generic-list{display:grid;gap:8px}
.course,.task,.notice,.file-row,.generic-row{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.course-title,.item-title{font-size:12px;font-weight:600;line-height:1.5;word-break:break-word}
.course-meta,.item-meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.6;word-break:break-word}
.course-end{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:9px;padding:4px 7px;border-radius:20px;background:var(--teal-pale);color:var(--teal);white-space:nowrap;font-weight:600}
.pill.warn{background:var(--amber-pale);color:var(--amber)}
.pill.red{background:var(--red-pale);color:var(--red)}
.pill.good{background:#e8f5ed;color:#28724b}
.pill.purple{background:#f2edfc;color:#6847a5}
.pill.neutral{background:#f0f2f5;color:#64748b}
.chev{color:#98a29f;font-size:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.field{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:12px}
.search{flex:1}
.progress{height:5px;background:#edf0ed;border-radius:9px;overflow:hidden;margin-top:8px}
.progress i{height:100%;display:block;background:var(--teal);border-radius:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.empty{background:#fff;padding:24px;text-align:center;border:1px dashed #d9dfda;border-radius:10px;color:var(--muted);font-size:12px}
.notice{align-items:start;grid-template-columns:30px 1fr auto}
.notice.unread{border-right:3px solid var(--teal)}
.notice-mark{width:29px;height:29px;border-radius:8px;background:var(--teal-pale);color:var(--teal);display:grid;place-items:center;font-weight:700}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:14px;background:white}
.setting:first-child{border-radius:10px 10px 0 0}
.setting:last-child{border:0;border-radius:0 0 10px 10px}
.setting strong{font-size:12px}
.setting p{margin:3px 0 0;color:var(--muted);font-size:10px}
.switch{accent-color:var(--teal);width:17px;height:17px;cursor:pointer}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));overflow:auto;gap:7px;padding-bottom:4px}
.day{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;min-height:155px}
.day.today-col{border-color:var(--teal);background:#fbfdff}
.day h3{margin:0 0 8px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.event{background:var(--teal-pale);color:#365b94;border-radius:6px;padding:6px;margin:5px 0;font-size:10px;line-height:1.5;width:100%;text-align:right;border:0;display:block}
.event.assignment{background:var(--amber-pale);color:#805619;cursor:pointer}
.event.done-ev{background:#e8f5ed;color:#28724b;cursor:pointer}
.event small{display:block;font-size:9px;opacity:.85}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.table{width:100%;border-collapse:collapse;background:#fff;font-size:11px}
.table th,.table td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
.table th{color:var(--muted);font-weight:500;background:#fafbf9;white-space:nowrap}
.table tr:last-child td{border:0}
.callout{background:#f9f7f0;border:1px solid #ece7d7;color:#6c5a36;border-radius:9px;padding:10px 12px;font-size:11px;line-height:1.7;margin:10px 0}
.callout.info{background:var(--teal-pale);border-color:#d5e1f2;color:#365b94}
.modal-back{position:fixed;inset:0;background:#15211f66;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:13px;width:min(530px,100%);max-height:85vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0002}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:10px}
.modal h2{font-size:17px;margin:0;line-height:1.4}
.close{border:0;background:#f1f3ef;border-radius:7px;width:30px;height:30px;flex-shrink:0;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#203655;color:#fff;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow);display:none;z-index:40;font-size:11px;max-width:90%;text-align:center}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.help-card{background:white;border:1px solid var(--line);border-radius:9px;padding:12px}
.help-card strong{font-size:12px}
.help-card p{font-size:10px;line-height:1.7;color:var(--muted);margin:5px 0 0}
.bottom{display:none}
.footnote{font-size:10px;color:#919a96;margin-top:14px;line-height:1.7}
.tag{font-size:9px;border-radius:20px;padding:3px 8px;background:#f1f3ef;color:#64716c;display:inline-flex;align-items:center;gap:4px}
.form-grid{display:grid;gap:10px;margin-top:10px}
.form-grid label{font-size:11px;font-weight:600;display:block;margin-bottom:4px;color:var(--ink)}
@media(max-width:900px){
  .layout{grid-template-columns:175px minmax(0,1fr);gap:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:690px){
  .shell{padding:0 15px}
  .top{height:61px}
  .layout{display:block;padding-top:19px;padding-bottom:95px}
  .side{display:none}
  .welcome h1,.page-title h1{font-size:20px}
  .welcome{align-items:flex-start}
  .today{display:none}
  .stats{gap:7px}
  .stat{padding:10px}
  .stat strong{font-size:18px}
  .urgent{padding:13px;grid-template-columns:1fr}
  .bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}
  .bottom button{border:0;background:none;color:#79837f;display:grid;justify-items:center;gap:2px;font-size:9px;padding:2px;position:relative}
  .bottom button.active{color:var(--teal);font-weight:600}
  .bottom span:first-child{font-size:15px}
  .sync{font-size:9px;margin:0}
  .sync .sync-long{display:none}
  .right-head{gap:5px}
  .grid2{grid-template-columns:1fr}
  .calendar{grid-template-columns:repeat(7,118px)}
  .table th,.table td{padding:8px 6px}
  .help-grid{grid-template-columns:1fr}
  .toolbar .search{flex-basis:100%}
  .toast{bottom:75px}
  .course,.task{grid-template-columns:1fr;gap:8px}
  .course-end{justify-content:space-between;width:100%;border-top:1px solid #f1f4f9;padding-top:7px}
}
@media(max-width:380px){
  .brand small{font-size:9px}
  .stats{grid-template-columns:1fr 1fr}
  .sync{display:none}
  .course-end{gap:5px}
  .pill{font-size:8.5px}
  .btn{padding:7px 8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="shell top-inner">
    <div class="brand" onclick="go('home')">
      <div class="mark">م</div>
      <div>
        <strong>دفتر الطالب</strong>
        <small>جامعة مؤتة · المتابعة الأكاديمية</small>
      </div>
    </div>
    <div class="right-head">
      <div class="sync" id="syncBox">● <b id="syncState">مزامنة نشطة</b> <span id="syncLong" class="sync-long">· آخر فحص <span id="syncWhen">الآن</span></span></div>
      <button class="icon-btn" title="مركز الإشعارات" onclick="go('notifications')">♧<sup id="bellCount" style="font-size:8px;color:#a14f49;font-weight:700"></sup></button>
      <button class="icon-btn" id="btnSyncTop" title="مزامنة الآن من LMS" onclick="syncNow()">↻</button>
      <div class="avatar" id="userAvatar" title="الإعدادات والحساب" onclick="go('settings')">ط</div>
    </div>
  </div>
</header>

<div class="shell layout">
  <aside class="side">
    <div class="side-label">مساحة الطالب</div>
    <nav class="nav" id="sideNav"></nav>
    <div class="semester">
      <small>الفصل الدراسي</small>
      <strong>الأول · ٢٠٢٦ / ٢٠٢٧</strong>
    </div>
    <p class="footnote" id="sideStatusNote">متصل بنظام التعليم الإلكتروني (Moodle LMS) لجامعة مؤتة</p>
  </aside>
  <main class="content" id="content">
    <div class="empty">جارٍ تحميل بياناتك الأكاديمية...</div>
  </main>
</div>

<nav class="bottom" id="bottomNav"></nav>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#f4f7fb');
  } catch (e) {}
}

function getTelegramId() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    return String(tg.initDataUnsafe.user.id);
  }
  const p = new URLSearchParams(window.location.search);
  return p.get('tid') || '';
}

const navItems = [
  ['home', '⌂', 'الرئيسية'],
  ['week', '▦', 'الأسبوع'],
  ['courses', '▤', 'المقررات'],
  ['tasks', '☷', 'المهام'],
  ['grades', '▥', 'العلامات'],
  ['attendance', '✓', 'الحضور'],
  ['announcements', '♧', 'الإعلانات'],
  ['files', '▧', 'الملفات'],
  ['notifications', '◉', 'الإشعارات'],
  ['settings', '⚙', 'الإعدادات'],
  ['help', '?', 'المساعدة']
];

// State
let active = 'home';
let selectedCourse = null;
let weekOffset = 0;
let isSyncing = false;
let isLoggedIn = false;
let userProfile = {
  full_name: 'طالب جامعة مؤتة',
  lms_username: '',
  is_monitoring: true,
  check_interval: 10,
  last_check: 'لم يتم بعد',
  notify_assign: true,
  notify_quiz: true,
  notify_resource: true,
  notify_grade: true,
  notify_announcement: true,
  notify_attendance: true
};

let courses = [];
let tasks = [];
let grades = [];
let attendanceList = [];
let announcements = [];
let files = [];

// Local + Server synced personal workspace state
const savedLocal = JSON.parse(localStorage.getItem('mutahStudentNotebook') || '{}');
let doneSet = new Set(savedLocal.done || []);
let readSet = new Set(savedLocal.read || []);
let notes = savedLocal.notes || {};
let reminders = savedLocal.reminders || [];
let courseMeta = savedLocal.courseMeta || {};
let limit = Number(savedLocal.limit) || 20;
let syncLogs = savedLocal.logs || [];

// Task / Grade / File filter state
let taskFilterState = { state: 'all', course: 'all', type: 'all' };
let gradeFilterState = { course: 'all', filter: 'all' };
let newsFilterState = { filter: 'all', course: 'all' };
let fileFilterState = { course: 'all', q: '' };
let courseSearchQuery = '';

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function persist(syncServer = true) {
  const payload = {
    done: [...doneSet],
    read: [...readSet],
    notes,
    reminders,
    courseMeta,
    limit,
    logs: syncLogs
  };
  localStorage.setItem('mutahStudentNotebook', JSON.stringify(payload));
  if (syncServer && isLoggedIn) {
    fetch('/api/user-meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tid: getTelegramId(),
        initData: tg?.initData || '',
        meta: {
          notes,
          personal_reminders: reminders,
          read_announcements: [...readSet],
          absence_limit: limit,
          course_meta: courseMeta,
          sync_logs: syncLogs.slice(0, 15)
        }
      })
    }).catch(() => {});
  }
}

function extractTeacher(name) {
  const m = String(name || '').match(/(د\.\s*[^\-\(\)|]+|أ\.\s*[^\-\(\)|]+)/);
  return m ? m[1].trim() : 'هيئة التدريس';
}

function parseLmsDate(str, ts) {
  if (ts && Number(ts) > 0) return new Date(Number(ts) * 1000);
  if (!str) return null;
  const cleaned = String(str).replace(/^(Due|Closes|Closed|Opened|Opens)\s*:\s*/i, '').trim();
  const d = new Date(cleaned);
  if (!isNaN(d.getTime())) return d;
  return null;
}

function fmtDate(dInput, fallbackStr) {
  if (!dInput && !fallbackStr) return 'بدون موعد محدد';
  const d = dInput instanceof Date ? dInput : (dInput ? new Date(dInput) : null);
  if (d && !isNaN(d.getTime())) {
    try {
      return d.toLocaleString('ar-JO', {
        weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
      });
    } catch (e) {
      return fallbackStr || d.toLocaleDateString();
    }
  }
  return fallbackStr || 'بدون موعد محدد';
}

function course(id) {
  return courses.find(c => String(c.id) === String(id)) || {
    id: id, name: 'مقرر دراسي', code: `ID ${id}`, teacher: 'هيئة التدريس', room: 'LMS', time: '', attendance: 0, absent: 0, total: 0, grade: null
  };
}

function isTaskDone(t) {
  return Boolean(t.done || doneSet.has(String(t.id)));
}

function dueInfo(t) {
  if (isTaskDone(t)) return ['مكتمل في LMS', 'pill good'];
  if (!t.dueDateObj) return ['قيد الحل', 'pill warn'];
  const diff = t.dueDateObj.getTime() - Date.now();
  const days = Math.ceil(diff / 86400000);
  if (diff < 0) return ['متأخر / مغلق', 'pill red'];
  if (days <= 2) {
    const lbl = days <= 0 ? 'اليوم' : days === 1 ? 'غداً' : 'خلال يومين';
    return ['قريب · ' + lbl, 'pill warn'];
  }
  return [t.time_remaining ? `متبقي ${t.time_remaining}` : 'قادم', 'pill'];
}

function unreadCount() {
  return announcements.filter(a => !readSet.has(String(a.id))).length;
}

function updateTopBar() {
  const stEl = document.getElementById('syncState');
  const whEl = document.getElementById('syncWhen');
  const boxEl = document.getElementById('syncBox');
  const avEl = document.getElementById('userAvatar');

  if (!isLoggedIn) {
    stEl.textContent = 'غير مربوط';
    whEl.textContent = 'سجل دخولك';
    boxEl.classList.add('paused');
    avEl.textContent = '؟';
    return;
  }

  if (userProfile.is_monitoring) {
    stEl.textContent = 'مزامنة نشطة';
    boxEl.classList.remove('paused');
  } else {
    stEl.textContent = 'مراقبة متوقفة';
    boxEl.classList.add('paused');
  }
  whEl.textContent = userProfile.last_check || 'لم يتم بعد';

  const cleanName = String(userProfile.full_name || 'طالب').trim();
  avEl.textContent = cleanName ? cleanName.charAt(0) : 'ط';
}

async function fetchUserData() {
  try {
    const tid = getTelegramId();
    const qs = new URLSearchParams({
      tid: tid,
      initData: tg?.initData || '',
      _t: Date.now()
    });
    const res = await fetch('/api/user-data?' + qs.toString());
    const data = await res.json();

    if (!data.success || data.not_registered) {
      isLoggedIn = false;
      updateTopBar();
      render();
      return;
    }

    isLoggedIn = true;
    userProfile = data.user || userProfile;

    // Merge server user_meta if present
    if (data.user_meta && typeof data.user_meta === 'object') {
      const m = data.user_meta;
      if (m.notes && typeof m.notes === 'object') notes = { ...notes, ...m.notes };
      if (Array.isArray(m.personal_reminders) && m.personal_reminders.length) reminders = m.personal_reminders;
      if (Array.isArray(m.read_announcements)) m.read_announcements.forEach(id => readSet.add(String(id)));
      if (m.absence_limit) limit = Number(m.absence_limit) || 20;
      if (m.course_meta && typeof m.course_meta === 'object') courseMeta = { ...courseMeta, ...m.course_meta };
      if (Array.isArray(m.sync_logs) && m.sync_logs.length) syncLogs = m.sync_logs;
      persist(false);
    }

    attendanceList = data.attendance || [];
    const attByCourse = {};
    attendanceList.forEach(a => {
      attByCourse[String(a.course_id)] = a;
    });

    grades = (data.grades || []).map(g => ({
      id: g.item_id,
      course_id: String(g.course_id),
      course_name: g.course_name || 'مقرر',
      item_name: g.item_name || 'تقييم',
      grade_val: g.grade_val || '',
      grade_max: g.grade_max || '',
      percentage: g.percentage || '',
      feedback: g.feedback || '',
      url: g.url || '',
      updated_at: g.updated_at ? String(g.updated_at).slice(0, 10) : 'مرصود'
    }));

    const gradeByItem = {};
    grades.forEach(g => {
      if (g.id && g.grade_val) {
        gradeByItem[String(g.id).replace('mod_', '')] = g;
      }
    });

    courses = (data.courses || []).map(c => {
      const cid = String(c.id);
      const meta = courseMeta[cid] || {};
      const att = attByCourse[cid];
      const present = att ? (Number(att.present_count) || 0) + (Number(att.late_count) || 0) + (Number(att.excused_count) || 0) : 0;
      const absent = att ? (Number(att.absent_count) || 0) : 0;
      const taken = att ? (Number(att.taken_sessions) || (present + absent)) : 0;

      // Calculate average grade if numeric percentages exist for this course
      const cGrades = grades.filter(g => g.course_id === cid && g.grade_val);
      let avgPct = null;
      const pctNums = [];
      cGrades.forEach(g => {
        const pm = String(g.percentage || '').match(/(\d+(?:\.\d+)?)/);
        if (pm) pctNums.push( parseFloat(pm[1]) );
      });
      if (pctNums.length > 0) {
        avgPct = Math.round(pctNums.reduce((a, b) => a + b, 0) / pctNums.length);
      }

      return {
        id: cid,
        name: c.name,
        url: c.url || `https://mulms.mutah.edu.jo/course/view.php?id=${cid}`,
        is_monitored: Boolean(c.is_monitored),
        code: meta.code || `ID ${cid}`,
        teacher: meta.teacher || extractTeacher(c.name),
        room: meta.room || 'بوابة التعليم الإلكتروني',
        time: meta.time || '',
        attendance: present,
        absent: absent,
        total: taken,
        att_points: att ? (att.points_str || '') : '',
        att_pct_str: att ? (att.percentage_str || '') : '',
        att_sessions: att ? (att.sessions || []) : [],
        att_url: att ? (att.att_url || '') : '',
        grade: avgPct,
        graded_count: cGrades.length,
        stats: c.stats || { assignments: 0, quizzes: 0, resources: 0, tasks_total: 0, tasks_done: 0 }
      };
    });

    if (!selectedCourse && courses.length > 0) {
      selectedCourse = courses[0].id;
    }

    tasks = (data.deadlines || []).map(d => {
      const cidStr = String(d.content_id || d.id);
      const rawCmid = cidStr.replace(/^(assign_|quiz_)/, '');
      const isQuiz = d.content_type === 'quiz' || cidStr.startsWith('quiz_');
      const dueObj = parseLmsDate(d.due_str, d.due_ts);
      const matchedGrade = gradeByItem[rawCmid] || null;
      const isSub = Boolean(d.is_submitted);
      if (isSub) doneSet.add(cidStr);

      return {
        id: cidStr,
        title: d.content_name || 'مهمة دراسية',
        course: String(d.course_id || ''),
        course_name: d.course_name || course(d.course_id).name,
        type: isQuiz ? 'اختبار قصير' : 'واجب',
        raw_type: isQuiz ? 'quiz' : 'assign',
        due: dueObj ? dueObj.toISOString() : '',
        dueDateObj: dueObj,
        due_str: d.due_str || '',
        time_remaining: d.time_remaining || '',
        desc: isQuiz
          ? 'اختبار إلكتروني عبر منصة جامعة مؤتة (Moodle LMS).'
          : 'واجب تسليم إلكتروني عبر منصة جامعة مؤتة (Moodle LMS).',
        url: d.content_url || `https://mulms.mutah.edu.jo/course/view.php?id=${d.course_id}`,
        done: isSub,
        grade: matchedGrade
      };
    });

    announcements = (data.announcements || []).map(a => ({
      id: String(a.discuss_id || a.id),
      course: String(a.course_id || ''),
      course_name: a.course_name || course(a.course_id).name,
      title: a.title || 'إعلان دراسي',
      author: a.author || '',
      date: a.posted_date || (a.first_seen ? String(a.first_seen).slice(0, 10) : 'حديثاً'),
      body: a.body_text || a.forum_name || 'إعلان منشور في منتدى المقرر على نظام LMS.',
      url: a.url || ''
    }));

    files = (data.files || []).map(f => ({
      id: String(f.id || ''),
      name: f.name || 'ملف دراسي',
      course_id: String(f.course_id || ''),
      course: f.course || 'مقرر دراسي',
      kind: f.kind || 'ملف',
      date: f.date ? String(f.date).slice(0, 10) : 'مرصود',
      url: f.url || ''
    }));

    updateTopBar();
    render();
  } catch (err) {
    console.error('Error fetching data:', err);
    toast('تعذر تحديث البيانات من الخادم');
  }
}

function openExternalLink(url) {
  if (!url) {
    toast('الرابط غير متوفر');
    return;
  }
  if (tg && tg.openLink) {
    try {
      tg.openLink(url);
      return;
    } catch (e) {}
  }
  window.open(url, '_blank', 'noopener');
}

}

function courseCard(c) {
  const missRate = c.total ? Math.round((c.absent / c.total) * 100) : 0;
  const alert = c.total > 0 && missRate >= limit;
  const hasUrgentTask = tasks.some(t => t.course === c.id && !isTaskDone(t) && t.dueDateObj && (t.dueDateObj.getTime() - Date.now() <= 172800000) && (t.dueDateObj.getTime() >= Date.now()));
  let pillClass = '';
  let pillText = 'محدّث';
  if (!c.is_monitored) {
    pillClass = 'neutral';
    pillText = 'متوقف مؤقتاً';
  } else if (alert) {
    pillClass = 'red';
    pillText = 'اقتراب من حد الغياب';
  } else if (hasUrgentTask) {
    pillClass = 'warn';
    pillText = 'واجب قريب';
  }

  const tasksInfo = c.stats && c.stats.tasks_total > 0
    ? ` · المهام: ${c.stats.tasks_done}/${c.stats.tasks_total} منجز`
    : '';
  const filesInfo = c.stats && c.stats.resources > 0
    ? ` · ${c.stats.resources} ملف`
    : '';

  return `<article class="course">
    <div>
      <button class="text-link course-title" onclick="openCourse('${escapeHTML(c.id)}')">${escapeHTML(c.name)}</button>
      <div class="course-meta">${escapeHTML(c.code)} · ${escapeHTML(c.teacher)}${escapeHTML(tasksInfo)}${escapeHTML(filesInfo)}${c.time ? ' · ' + escapeHTML(c.time) : ''}</div>
    </div>
    <div class="course-end">
      <span class="pill ${pillClass}">${pillText}</span>
      <button class="text-link" onclick="openCourse('${escapeHTML(c.id)}')">تفاصيل ‹</button>
    </div>
  </article>`;
}

async function submitLogin() {
  const u = document.getElementById('loginUser')?.value?.trim();
  const p = document.getElementById('loginPass')?.value?.trim();
  if (!u || !p) {
    toast('يرجى إدخال الرقم الجامعي وكلمة المرور');
    return;
  }
  const btn = document.getElementById('btnDoLogin');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'جارٍ التحقق والاتصال بجامعة مؤتة...';
  }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '', username: u, password: p })
    });
    const d = await res.json();
    if (d.success) {
      toast('تم تسجيل الدخول بنجاح! يمكنك الآن إضافة أو استيراد مقرراتك.');
      await fetchUserData();
    } else {
      toast(d.error || 'فشل تسجيل الدخول إلى LMS');
    }
  } catch (e) {
    toast('حدث خطأ في الاتصال بالخادم');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول وربط الحساب';
    }
  }
}

function getWeekBounds(offset) {
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0 = Sunday .. 6 = Saturday
  const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + (offset * 7));
  const saturday = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + 6);
  return { sunday, saturday };
}

function changeWeek(delta, reset = false) {
  if (reset) weekOffset = 0;
  else weekOffset += delta;
  render();
}

    .join('');

function weekPage() {
  const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const { sunday, saturday } = getWeekBounds(weekOffset);
  const rangeStr = `${sunday.toLocaleDateString('ar-JO', { day: 'numeric', month: 'short' })} – ${saturday.toLocaleDateString('ar-JO', { day: 'numeric', month: 'short', year: 'numeric' })}`;
  const todayStr = new Date().toDateString();

  return `
    ${header('المخطط الأسبوعي', 'نظرة واحدة على المحاضرات ومواعيد تسليم الواجبات والاختبارات خلال الأسبوع. انقر على أي مهمة لعرض تفاصيلها.')}
    <div class="toolbar">
      <button class="btn" onclick="changeWeek(-1)">‹ الأسبوع السابق</button>
      <span class="tag">${escapeHTML(rangeStr)}</span>
      ${weekOffset !== 0 ? `<button class="btn" onclick="changeWeek(0, true)">الأسبوع الحالي</button>` : ''}
      <button class="btn" onclick="changeWeek(1)">الأسبوع التالي ›</button>
      <button class="btn" style="margin-right:auto" onclick="openScheduleModal()">✎ ضبط مواعيد المحاضرات</button>
    </div>
    <div class="calendar">
      ${days.map((dName, i) => {
        const curDate = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
        const isToday = curDate.toDateString() === todayStr;
        const ev = weekCourseEvents(dName);
        const dayTasks = tasks.filter(t => {
          if (!t.dueDateObj) return false;
          return t.dueDateObj.getFullYear() === curDate.getFullYear() &&
                 t.dueDateObj.getMonth() === curDate.getMonth() &&
                 t.dueDateObj.getDate() === curDate.getDate();
        });
        const tev = dayTasks.map(t => {
          const done = isTaskDone(t);
          return `<button class="event ${done ? 'done-ev' : 'assignment'}" onclick="taskDetail('${escapeHTML(t.id)}')">
            ${done ? '✓ ' : '◷ '}${escapeHTML(t.title)}
            <small>${escapeHTML(t.course_name)} · ${done ? 'مكتمل' : 'موعد تسليم'}</small>
          </button>`;
        }).join('');
        return `<div class="day ${isToday ? 'today-col' : ''}">
          <h3><span>${dName} · ${curDate.getDate()}</span>${isToday ? '<span class="pill">اليوم</span>' : ''}</h3>
          ${ev}${tev || ''}
        </div>`;
      }).join('')}
    </div>
    <p class="footnote">تظهر مواعيد تسليم الواجبات والكويزات تلقائياً في أيام استحقاقها المرصودة من LMS. يمكنك أيضاً إضافة أوقات محاضراتك من زر «ضبط مواعيد المحاضرات».</p>
  `;
}

async function submitAddCourse() {
  const val = document.getElementById('newCourseInput')?.value?.trim();

    return;
  }
  const btn = document.getElementById('btnAddCourseSubmit');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'جارٍ جلب المقرر ومزامنته من LMS...';
  }
  try {
    const res = await fetch('/api/add-course', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '', course_id: val })
    });
    const d = await res.json();

      closeModal();
      toast(`تمت إضافة المقرر: ${d.course_name}`);
      await fetchUserData();

  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '＋ ربط المقرر وفحص محتواه';
    }
  }
}

function getFilteredTasks() {
  const s = taskFilterState.state;
  const c = taskFilterState.course;
  const y = taskFilterState.type;

  return tasks
    .filter(t => {
      const done = isTaskDone(t);
      const late = t.dueDateObj && t.dueDateObj.getTime() < Date.now() && !done;
      const matchCourse = c === 'all' || String(t.course) === String(c);
      const matchType = y === 'all' || t.type === y;
      const matchState =
        s === 'all' ||
        (s === 'done' && done) ||
        (s === 'pending' && !done) ||
        (s === 'late' && late);
      return matchCourse && matchType && matchState;
    })
    .sort((a, b) => {
      const aDone = isTaskDone(a) ? 1 : 0;
      const bDone = isTaskDone(b) ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      if (a.dueDateObj && b.dueDateObj) return a.dueDateObj - b.dueDateObj;
      if (a.dueDateObj) return -1;
      if (b.dueDateObj) return 1;
      return 0;
    });
}

function gradesPage() {
  return `
    ${header('سجل العلامات', 'تفاصيل الدرجات والتقييمات المرصودة لكل مقرر مباشرة من كشف علامات LMS.')}
    <div class="toolbar">
      <select class="field" id="gradeCourse" onchange="filterGrades()">
        <option value="all">كل المقررات</option>
        ${courses.map(c => `<option value="${escapeHTML(c.id)}" ${String(gradeFilterState.course) === String(c.id) ? 'selected' : ''}>${escapeHTML(c.name)}</option>`).join('')}
      </select>
      <select class="field" id="gradeFilter" onchange="filterGrades()">
        <option value="all" ${gradeFilterState.filter === 'all' ? 'selected' : ''}>كل التقييمات (${grades.length})</option>
        <option value="graded" ${gradeFilterState.filter === 'graded' ? 'selected' : ''}>المرصودة فقط (${grades.filter(g => g.grade_val && g.grade_val !== '-').length})</option>
      </select>
      <button class="btn" style="margin-right:auto" onclick="syncNow()">↻ تحديث العلامات</button>
    </div>
    <div id="gradeTable"></div>
    <div class="callout">تُجلب الدرجات كما رصدها مدرس المقرر في سجل الدرجات (Gradebook) على منصة جامعة مؤتة.</div>
  `;
}

function filterGrades() {
  const c = document.getElementById('gradeCourse')?.value || gradeFilterState.course || 'all';
  const f = document.getElementById('gradeFilter')?.value || gradeFilterState.filter || 'all';
  gradeFilterState = { course: c, filter: f };

  const rows = grades.filter(g => {
    const matchCourse = c === 'all' || String(g.course_id) === String(c);
    const hasVal = Boolean(g.grade_val && g.grade_val !== '-' && g.grade_val !== '—');
    const matchFilter = f === 'all' || (f === 'graded' && hasVal);
    return matchCourse && matchFilter;
  });

  const tbl = document.getElementById('gradeTable');
  if (!tbl) return;
  if (!rows.length) {
    tbl.innerHTML = '<div class="empty">لا توجد علامات مسجلة تطابق الفلتر المحدد.</div>';
    return;
  }

  tbl.innerHTML = `
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>المقرر</th>
            <th>بند التقييم</th>
            <th>الدرجة</th>
            <th>المدى / العظمى</th>
            <th>النسبة / ملاحظات</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${escapeHTML(r.course_name)}</td>
              <td>
                ${r.url ? `<button class="text-link" style="font-weight:600" onclick="openExternalLink('${escapeHTML(r.url)}')">${escapeHTML(r.item_name)} ↗</button>` : `<b>${escapeHTML(r.item_name)}</b>`}
              </td>
              <td><b style="color:var(--teal)">${escapeHTML(r.grade_val || '—')}</b></td>
              <td>${escapeHTML(r.grade_max || '—')}</td>
              <td>${escapeHTML([r.percentage, r.feedback].filter(Boolean).join(' · ') || '—')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function attendancePage() {
  const withAtt = courses.filter(c => c.total > 0 || c.att_sessions.length > 0);
  const withoutAtt = courses.filter(c => c.total === 0 && c.att_sessions.length === 0);

  return `
    ${header('الحضور والغياب', 'السجل التفصيلي والنسبة لكل مقرر مع تنبيه غياب شخصي قابل للضبط.')}
    <div class="toolbar">
      <label class="tag" style="padding:6px 10px;font-size:11px">
        حد التنبيه الشخصي:
        <input id="absenceLimit" type="number" value="${limit}" min="5" max="50" style="width:45px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:2px 4px;text-align:center" onchange="setLimit(this.value)">
        ٪ من الغياب
      </label>
      <span class="tag">النسبة الرسمية تعتمد على سياسة الجامعة</span>
      <button class="btn" style="margin-right:auto" onclick="syncNow()">↻ تحديث السجلات</button>
    </div>
    <div class="course-list">
      ${withAtt.map(c => {
        const rate = c.total ? Math.round((c.attendance / c.total) * 100) : 100;
        const miss = c.total ? Math.round((c.absent / c.total) * 100) : 0;
        const alert = c.total > 0 && miss >= limit;
        return `
          <article class="card">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
              <div>
                <strong>${escapeHTML(c.name)}</strong>
                <div class="course-meta">
                  ${escapeHTML(c.code)} · ${c.attendance} حضور · ${c.absent} غياب من ${c.total} محاضرة مسجلة
                  ${c.att_points ? ` · النقاط: ${escapeHTML(c.att_points)}` : ''}
                </div>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <span class="${alert ? 'pill red' : 'pill good'}">${alert ? 'تنبيه غياب (' + miss + '٪)' : rate + '٪ حضور'}</span>
                ${c.att_sessions && c.att_sessions.length ? `<button class="btn" onclick="openAttendanceSessionsModal('${escapeHTML(c.id)}')">سجل الجلسات (${c.att_sessions.length})</button>` : ''}
                ${c.att_url ? `<button class="btn" onclick="openExternalLink('${escapeHTML(c.att_url)}')">LMS ↗</button>` : ''}
              </div>
            </div>
            <div class="progress"><i style="width:${rate}%;background:${alert ? 'var(--red)' : 'var(--teal)'}"></i></div>
            ${alert ? `<p class="item-meta" style="color:var(--red);font-weight:600;margin-top:7px">⚠️ تنبيه: نسبة الغياب في هذا المقرر (${miss}٪) وصلت أو تجاوزت حد التنبيه الشخصي (${limit}٪).</p>` : ''}
          </article>
        `;
      }).join('') || '<div class="empty">لا توجد سجلات حضور (Attendance) مفعلة من قِبل المدرسين في مقرراتك الحالية حتى الآن.</div>'}
    </div>
    ${withoutAtt.length ? `
      <div class="section-head"><h2>مقررات بدون أداة حضور إلكتروني في LMS</h2></div>
      <div class="course-list">
        ${withoutAtt.map(c => `
          <article class="course">
            <div>
              <strong class="course-title">${escapeHTML(c.name)}</strong>
              <div class="course-meta">${escapeHTML(c.code)} · لم يضف مدرس المساق جدول حضور إلكتروني في صفحة المقرر</div>
            </div>
            <span class="pill neutral">غير مفعّل في LMS</span>
          </article>
        `).join('')}
      </div>
    ` : ''}
    <p class="footnote">استخدم حد التنبيه للمتابعة الشخصية؛ يرسل البوت أيضاً إشعاراً فورياً عبر تيليجرام عند رصد أي محاضرة جديدة في سجل الحضور.</p>
  `;
}

function openAttendanceSessionsModal(cid) {
  const c = course(cid);
  const sessions = c.att_sessions || [];
  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div>
        <span class="pill">سجل المحاضرات</span>
        <h2 style="margin-top:6px">${escapeHTML(c.name)}</h2>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <p class="item-meta">${c.attendance} حضور · ${c.absent} غياب · الإجمالي: ${c.total} محاضرة</p>
    <div class="table-wrap" style="margin-top:10px">
      <table class="table">
        <thead><tr><th>التاريخ والوقت</th><th>الحالة</th><th>النقاط</th><th>ملاحظات</th></tr></thead>
        <tbody>
          ${sessions.map(s => {
            const st = String(s.status || '');
            const isAbs = /absent|غائب|غياب/i.test(st);
            const isPres = /present|حاضر|موجود/i.test(st);
            return `
              <tr>
                <td>${escapeHTML(s.date || '—')}</td>
                <td><span class="pill ${isAbs ? 'red' : isPres ? 'good' : 'warn'}">${escapeHTML(st || '—')}</span></td>
                <td>${escapeHTML(s.points || '—')}</td>
                <td>${escapeHTML(s.remarks || '—')}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="actions" style="margin-top:14px">
      ${c.att_url ? `<button class="btn btn-primary" onclick="openExternalLink('${escapeHTML(c.att_url)}')">فتح سجل الحضور في LMS ↗</button>` : ''}
      <button class="btn" onclick="closeModal()">إغلاق</button>
    </div>
  `;
  document.getElementById('modalBack').style.display = 'flex';
}

function setLimit(v) {
  limit = Math.min(50, Math.max(5, Number(v) || 20));
  persist(true);
  render();
  toast('تم حفظ حد تنبيه الغياب');
}

function announcementsPage() {
  const f = newsFilterState.filter;
  const c = newsFilterState.course;
  const list = announcements.filter(a => {
    const isRead = readSet.has(String(a.id));
    const matchRead = f === 'all' || (f === 'read' && isRead) || (f === 'unread' && !isRead);
    const matchCourse = c === 'all' || String(a.course) === String(c);
    return matchRead && matchCourse;
  });

  return `
    ${header('إعلانات المقررات', 'الإعلانات والمنشورات الصادرة من مدرسي المقررات في منتديات الأخبار على LMS.')}
    <div class="toolbar">
      <select class="field" id="newsFilter" onchange="filterNews()">
        <option value="all" ${f === 'all' ? 'selected' : ''}>كل الإعلانات (${announcements.length})</option>
        <option value="unread" ${f === 'unread' ? 'selected' : ''}>غير المقروءة (${unreadCount()})</option>
        <option value="read" ${f === 'read' ? 'selected' : ''}>المقروءة</option>
      </select>
      <select class="field" id="newsCourse" onchange="filterNews()">
        <option value="all">كل المقررات</option>
        ${courses.map(co => `<option value="${escapeHTML(co.id)}" ${String(c) === String(co.id) ? 'selected' : ''}>${escapeHTML(co.name)}</option>`).join('')}
      </select>
      <button class="btn" onclick="markAllRead()">تعليم الكل كمقروء</button>
    </div>
    <div class="notice-list" id="newsList">
      ${list.map(announceCard).join('') || '<div class="empty">لا توجد إعلانات ضمن هذا الفلتر حالياً.</div>'}
    </div>
  `;
}

function filterNews() {
  newsFilterState.filter = document.getElementById('newsFilter')?.value || 'all';
  newsFilterState.course = document.getElementById('newsCourse')?.value || 'all';
  render();
}

function openAnnouncementModal(id) {
  const a = announcements.find(x => String(x.id) === String(id));
  if (!a) return;
  readSet.add(String(a.id));
  persist(true);
  render();
  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div>
        <span class="pill">إعلان مقرر</span>
        <h2 style="margin-top:8px">${escapeHTML(a.title)}</h2>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <p class="item-meta">${escapeHTML(a.course_name)}${a.author ? ' · الناشر: ' + escapeHTML(a.author) : ''} · ${escapeHTML(a.date)}</p>
    <div class="callout" style="white-space:pre-line">${escapeHTML(a.body)}</div>
    <div class="actions">
      ${a.url ? `<button class="btn btn-primary" onclick="openExternalLink('${escapeHTML(a.url)}')">فتح الإعلان في LMS ↗</button>` : ''}
      <button class="btn" onclick="closeModal()">إغلاق</button>
    </div>
  `;
  document.getElementById('modalBack').style.display = 'flex';
}

function readAnnouncement(id) {
  const sid = String(id);
  if (readSet.has(sid)) readSet.delete(sid);
  else readSet.add(sid);
  persist(true);
  render();
  toast('تم تحديث حالة القراءة');
}

function markAllRead() {
  announcements.forEach(a => readSet.add(String(a.id)));
  persist(true);
  render();
  toast('تم تعليم كافة الإعلانات كمقروءة');
}

function filesPage() {
  const c = fileFilterState.course;
  const q = fileFilterState.q.toLowerCase();
  const list = files.filter(f =>
    (c === 'all' || f.course === c) &&
    (f.name.toLowerCase().includes(q) || f.course.toLowerCase().includes(q) || f.kind.toLowerCase().includes(q))
  );

  return `
    ${header('ملفات المقررات', 'المحاضرات والشرائح والملفات الدراسية التي رُفعت على صفحات مقرراتك في LMS.')}
    <div class="toolbar">
      <select class="field" id="fileCourse" onchange="filterFiles()">
        <option value="all">كل المقررات (${files.length} ملف)</option>
        ${courses.map(co => `<option value="${escapeHTML(co.name)}" ${c === co.name ? 'selected' : ''}>${escapeHTML(co.name)}</option>`).join('')}
      </select>
      <input class="field search" id="fileSearch" value="${escapeHTML(fileFilterState.q)}" placeholder="ابحث عن ملف أو محاضرة..." oninput="filterFiles()">
    </div>
    <div class="file-list" id="fileList">
      ${list.map(fileCard).join('') || '<div class="empty">لا توجد ملفات مطابقة لبحثك.</div>'}
    </div>
    <p class="footnote">اضغط على «فتح / تنزيل ↗» لفتح الملف مباشرة عبر منصة جامعة مؤتة (LMS)، كما يقوم البوت بإرسال الملفات الجديدة تلقائياً في محادثة تيليجرام.</p>
  `;
}

function filterFiles() {
  fileFilterState.course = document.getElementById('fileCourse')?.value || 'all';
  fileFilterState.q = document.getElementById('fileSearch')?.value || '';
  const c = fileFilterState.course;
  const q = fileFilterState.q.toLowerCase();
  const list = files.filter(f =>
    (c === 'all' || f.course === c) &&
    (f.name.toLowerCase().includes(q) || f.course.toLowerCase().includes(q) || f.kind.toLowerCase().includes(q))
  );
  const el = document.getElementById('fileList');
  if (el) el.innerHTML = list.map(fileCard).join('') || '<div class="empty">لا توجد ملفات مطابقة.</div>';
}

function notificationsPage() {
  const entries = [
    ...announcements.filter(a => !readSet.has(String(a.id))).map(a => ({
      kind: 'إعلان جديد',
      pill: 'pill',
      title: a.title,
      meta: `${a.course_name} · ${a.date}`,
      onclick: `openAnnouncementModal('${escapeHTML(a.id)}')`
    })),
    ...tasks.filter(t => !isTaskDone(t)).map(t => {
      const [lbl, cl] = dueInfo(t);
      return {
        kind: lbl,
        pill: cl,
        title: `${t.type}: ${t.title}`,
        meta: `${t.course_name} · ${fmtDate(t.dueDateObj, t.due_str)}`,
        onclick: `taskDetail('${escapeHTML(t.id)}')`
      };
    }),
    ...courses.filter(c => c.total > 0 && Math.round((c.absent / c.total) * 100) >= limit).map(c => ({
      kind: 'تنبيه غياب',
      pill: 'pill red',
      title: `تجاوز حد الغياب الشخصي في: ${c.name}`,
      meta: `${c.absent} غياب من ${c.total} محاضرة (${Math.round((c.absent / c.total) * 100)}٪)`,
      onclick: `go('attendance')`
    })),
    ...reminders.map((r, idx) => ({
      kind: 'تذكير شخصي',
      pill: 'pill purple',
      title: `تذكير: ${r.title}`,
      meta: `${r.course_name ? r.course_name + ' · ' : ''}${r.when}`,
      onclick: r.task_id ? `taskDetail('${escapeHTML(r.task_id)}')` : `toast('تذكير شخصي محفوظ')`,
      delIdx: idx
    }))
  ];

  return `
    ${header('مركز الإشعارات والتنبيهات', 'الإعلانات غير المقروءة والمهام الجارية وتنبيهات الغياب والتذكيرات الشخصية في مكان واحد.')}
    <div class="toolbar">
      <button class="btn" onclick="markAllRead()">تعليم الإعلانات كمقروءة</button>
      <button class="btn" onclick="openCustomReminderModal()">＋ تذكير شخصي جديد</button>
      <span class="tag">${entries.length} عناصر</span>
    </div>
    <div class="generic-list">
      ${entries.map(e => `
        <article class="generic-row">
          <div>
            <button class="text-link item-title" onclick="${e.onclick}">${escapeHTML(e.title)}</button>
            <div class="item-meta">${escapeHTML(e.meta)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="${e.pill}">${escapeHTML(e.kind)}</span>
            ${typeof e.delIdx === 'number' ? `<button class="btn" style="padding:4px 8px" title="حذف التذكير" onclick="removePersonalReminder(${e.delIdx})">×</button>` : ''}
          </div>
        </article>
      `).join('') || '<div class="empty">لا توجد إشعارات أو تنبيهات معلقة حالياً.</div>'}
    </div>
    <p class="footnote">بالإضافة إلى هذا المركز، يرسل البوت إشعارات فورية إلى حسابك في تيليجرام عند نشر أي واجب أو علامة أو إعلان أو ملف جديد.</p>
  `;
}

function openCustomReminderModal(taskId = '') {
  const t = taskId ? tasks.find(x => String(x.id) === String(taskId)) : null;
  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <h2>إضافة تذكير شخصي</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="form-grid" style="margin-top:12px">
      <div>
        <label>عنوان التذكير</label>
        <input id="remTitle" class="field" style="width:100%" value="${escapeHTML(t ? t.title : '')}" placeholder="مثال: مراجعة الفصل الرابع أو تسليم التقرير">
      </div>
      <div>
        <label>الموعد أو الملاحظة الزمنية</label>
        <input id="remWhen" class="field" style="width:100%" placeholder="مثال: غداً الساعة ٨ مساءً / قبل الموعد بيوم">
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="saveCustomReminder('${escapeHTML(taskId)}', '${escapeHTML(t ? t.course_name : '')}')">حفظ التذكير</button>
        <button class="btn" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  `;
  document.getElementById('modalBack').style.display = 'flex';
}

function saveCustomReminder(taskId, courseName) {
  const title = document.getElementById('remTitle')?.value?.trim();
  const when = document.getElementById('remWhen')?.value?.trim();
  if (!title || !when) {
    toast('يرجى كتابة عنوان التذكير وموعده');
    return;
  }
  reminders.unshift({
    task_id: taskId || '',
    title,
    course_name: courseName || '',
    when,
    created_at: new Date().toISOString()
  });
  persist(true);
  closeModal();
  render();
  toast('تم حفظ التذكير الشخصي في مركز الإشعارات');
}

function removePersonalReminder(idx) {
  reminders.splice(idx, 1);
  persist(true);
  render();
  toast('تم حذف التذكير الشخصي');
}

function settingsPage() {
  const prefItems = [
    ['notify_assign', 'الواجبات والمواعيد', 'إشعار فوري عند نشر واجب جديد أو تذكيرات العد التنازلي (٢٤ ساعة، ٣ ساعات، ساعة)'],
    ['notify_quiz', 'الاختبارات القصيرة (Quizzes)', 'إشعار فوري عند إضافة كويز جديد أو اقتراب موعد إغلاقه'],
    ['notify_resource', 'ملفات ومحاضرات المقررات', 'إرسال ملفات المقرر الجديدة مباشرة إلى محادثة تيليجرام'],
    ['notify_grade', 'رادار العلامات الجديدة', 'إشعار فوري عند رصد أو تعديل أي درجة في سجل العلامات'],
    ['notify_announcement', 'إعلانات المقررات', 'إشعار فوري عند نشر إعلان جديد من مدرس المقرر'],
    ['notify_attendance', 'رادار الحضور والغياب', 'إشعار فوري عند تسجيل حالة حضور أو غياب جديدة في LMS']
  ];

  const intervals = [
    [1, 'كل دقيقة واحدة'],
    [2, 'كل دقيقتين'],
    [5, 'كل ٥ دقائق'],
    [10, 'كل ١٠ دقائق'],
    [15, 'كل ١٥ دقيقة'],
    [30, 'كل ٣٠ دقيقة'],
    [60, 'كل ساعة']
  ];

  return `
    ${header('الإعدادات والحساب', 'تحكم بتفضيلات الإشعارات الفورية في تيليجرام، دورة الفحص التلقائي، وإدارة حسابك الأكاديمي.')}
    <div class="section-head"><h2>تفضيلات إشعارات تيليجرام والمنصة</h2></div>
    <div class="card" style="padding:0">
      ${prefItems.map(([k, t, d]) => `
        <div class="setting">
          <div><strong>${t}</strong><p>${d}</p></div>
          <input class="switch" type="checkbox" ${userProfile[k] ? 'checked' : ''} onchange="setServerPref('${k}', this.checked)">
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h2>المزامنة والفحص التلقائي</h2></div>
    <div class="card" style="padding:0">
      <div class="setting">
        <div>
          <strong>تكرار الفحص التلقائي</strong>
          <p>الفترة الزمنية بين كل دورة فحص آلي لحسابك في LMS.</p>
        </div>
        <select class="field" onchange="setServerInterval(this.value)">
          ${intervals.map(([n, lbl]) => `<option value="${n}" ${Number(userProfile.check_interval) === n ? 'selected' : ''}>${lbl}</option>`).join('')}
        </select>
      </div>
      <div class="setting">
        <div>
          <strong>تشغيل المراقبة التلقائية النشطة</strong>
          <p>فحص المقررات في الخلفية على مدار الساعة وإرسال تنبيهات تيليجرام.</p>
        </div>
        <input class="switch" type="checkbox" ${userProfile.is_monitoring ? 'checked' : ''} onchange="setServerMonitoring(this.checked)">
      </div>
      <div style="padding:12px 14px">
        <button class="btn btn-primary" onclick="syncNow()">↻ فحص فوري الآن لكافة المقررات</button>
      </div>
    </div>

    <div class="section-head"><h2>حساب الجامعة (Moodle LMS)</h2></div>
    ${isLoggedIn ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div>
            <strong>${escapeHTML(userProfile.full_name)}</strong>
            <div class="item-meta">الرقم الجامعي: ${escapeHTML(userProfile.lms_username)} · آخر فحص: ${escapeHTML(userProfile.last_check)}</div>
          </div>
          <span class="pill good">مربوط ومتصل</span>
        </div>
        <div class="callout info">كلمة المرور مشفرة ومحفوظة بأمان لمعالجة جلسات المراقبة التلقائية مع بوابة جامعة مؤتة.</div>
        <div class="actions">
          <button class="btn btn-primary" onclick="openAddCourseModal()">＋ إضافة مقرر برقم ID</button>
          <button class="btn" onclick="syncAllCoursesFromLms()">استيراد مقرراتي من LMS</button>
          <button class="btn btn-danger" onclick="logoutAccount()">تسجيل الخروج من الحساب</button>
        </div>
      </div>
    ` : loginBannerCard()}
    <p class="footnote">جميع التغييرات في هذه الصفحة تُحفظ مباشرة في الخادم وتنعكس فوراً على البوت.</p>
  `;
}

async function setServerPref(key, val) {
  userProfile[key] = Boolean(val);
  try {
    await fetch('/api/update-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '', [key]: Boolean(val) })
    });
    toast('تم حفظ تفضيل الإشعارات في النظام');
  } catch (e) {
    toast('تعذر حفظ الإعدادات');
  }
}

async function setServerInterval(val) {
  const num = Number(val) || 10;
  userProfile.check_interval = num;
  try {
    await fetch('/api/update-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '', check_interval: num })
    });
    toast(`تم ضبط فترة الفحص التلقائي: كل ${num} دقائق`);
  } catch (e) {
    toast('تعذر حفظ فترة الفحص');
  }
}

async function setServerMonitoring(val) {
  userProfile.is_monitoring = Boolean(val);
  updateTopBar();
  try {
    await fetch('/api/update-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '', is_monitoring: Boolean(val) })
    });
    toast(val ? 'تم تفعيل المراقبة التلقائية' : 'تم إيقاف المراقبة التلقائية');
  } catch (e) {
    toast('تعذر تغيير حالة المراقبة');
  }
}

async function logoutAccount() {
  if (!confirm('هل تريد بالتأكيد تسجيل الخروج من حسابك الأكاديمي وإيقاف المراقبة؟')) return;
  try {
    const res = await fetch('/api/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '' })
    });
    const d = await res.json();
    if (d.success) {
      isLoggedIn = false;
      courses = [];
      tasks = [];
      grades = [];
      announcements = [];
      files = [];
      updateTopBar();
      render();
      toast('تم تسجيل الخروج من الحساب بنجاح');
    }
  } catch (e) {
    toast('حدث خطأ أثناء تسجيل الخروج');
  }
}

  return `
    ${header('المساعدة وحالة النظام', 'معلومات الاتصال الحية وإجابات سريعة حول مزايا دفتر الطالب الذكي.')}
    <div class="callout info">
      <b>حالة النظام:</b> ${isLoggedIn ? `متصل بحساب الطالب (${escapeHTML(userProfile.lms_username)}) · تتم متابعة ${courses.filter(c => c.is_monitored).length} مقررات دراسية · آخر فحص: ${escapeHTML(userProfile.last_check)}.` : 'غير مربوط بحساب جامعي حالياً — انتقل إلى الإعدادات لتسجيل الدخول.'}
    </div>
    <div class="help-grid">
      <article class="help-card">
        <strong>كيف يتم كشف إنجاز الواجبات والكويزات؟</strong>
        <p>يقوم النظام بفحص صفحات الواجبات والاختبارات وسجل الدرجات في LMS تلقائياً؛ وعند تسليمك للواجب أو إنهاء المحاولة يتحول إلى «مكتمل» وتتوقف تذكيرات العد التنازلي فوراً.</p>
      </article>
      <article class="help-card">
        <strong>كيف أضيف الموعد إلى تقويم هاتفي؟</strong>
        <p>افتح تفاصيل أي مهمة ثم اضغط «إضافة للتقويم» لتنزيل ملف تقويم قياسي (.ics) يعمل مع تقويم Apple وGoogle وOutlook.</p>
      </article>
      <article class="help-card">
        <strong>كيف أضيف تذكيراً أو ملاحظة شخصية؟</strong>
        <p>اضغط على عنوان أي مهمة لفتح نافذتها، ثم اكتب ملاحظتك أو أضف تذكيراً شخصياً؛ تُحفظ بياناتك في حسابك على الخادم وعلى جهازك.</p>
      </article>
      <article class="help-card">
        <strong>كيف تعمل مكتبة الملفات؟</strong>

      </article>
      <article class="help-card">
        <strong>كيف يعمل الفحص الفوري (↻)؟</strong>
        <p>عند الضغط على زر المزامنة في الأعلى، يتصل الخادم ببوابة جامعة مؤتة ويفحص كافة مقرراتك بالتوازي خلال ثوانٍ معدودة.</p>
      </article>
    </div>
    <div class="section-head">
      <h2>سجل عمليات المزامنة</h2>
      <button onclick="go('settings')">الإعدادات ←</button>
    </div>
    <div class="generic-list">
      ${syncLogs.slice(0, 8).map(l => `
        <div class="generic-row">
          <div>
            <strong class="item-title">${escapeHTML(l.status)}</strong>
            <div class="item-meta">${escapeHTML(l.time)} · ${escapeHTML(l.detail)}</div>
          </div>
          <span class="pill good">متزامن</span>
        </div>
      `).join('') || '<div class="empty">لا توجد سجلات مزامنة بعد. اضغط على زر المزامنة (↻) لإجراء فحص فوري.</div>'}
    </div>

function taskDetail(id) {
  const t = tasks.find(x => String(x.id) === String(id));
  if (!t) return;
  const c = course(t.course);
  const note = notes[t.id] || '';
  const done = isTaskDone(t);
  const [statusLbl, statusCls] = dueInfo(t);
  const pillMod = statusCls === 'pill red' ? 'red' : statusCls === 'pill warn' ? 'warn' : statusCls === 'pill good' ? 'good' : '';

  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div>
        <span class="pill ${pillMod}">${escapeHTML(t.type)}</span>
        <h2 style="margin-top:8px">${escapeHTML(t.title)}</h2>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <p class="item-meta">${escapeHTML(t.course_name)} · ${escapeHTML(c.teacher)}</p>
    <div class="callout">
      ${escapeHTML(t.desc)}<br>
      <b>الموعد:</b> ${escapeHTML(fmtDate(t.dueDateObj, t.due_str))} · <b>الحالة:</b> ${escapeHTML(statusLbl)}
      ${t.grade ? `<br><b>الدرجة المرصودة:</b> ${escapeHTML(t.grade.grade_val)}${t.grade.grade_max ? ' / ' + escapeHTML(t.grade.grade_max) : ''}` : ''}
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openExternalLink('${escapeHTML(t.url)}')">فتح المهمة في LMS ↗</button>
      <button class="btn" onclick="openCustomReminderModal('${escapeHTML(t.id)}')">＋ تذكير شخصي</button>
      <button class="btn" onclick="downloadICS('${escapeHTML(t.id)}')">إضافة للتقويم (.ics)</button>
      <button class="btn" onclick="toggleDone('${escapeHTML(t.id)}', true)">${done ? 'إلغاء الإنجاز' : 'تسجيل إنجاز ✓'}</button>
    </div>
    <div class="section-head"><h2>ملاحظتك الشخصية</h2></div>
    <textarea id="taskNote" class="field" style="width:100%;min-height:80px" placeholder="اكتب ملاحظة أو خطوة تالية حول هذا الواجب أو الاختبار...">${escapeHTML(note)}</textarea>
    <div class="actions">
      <button class="btn btn-primary" onclick="saveNote('${escapeHTML(t.id)}')">حفظ الملاحظة</button>
      <span class="tag">تُحفظ في حسابك وعلى هذا الجهاز</span>
    </div>
  `;
  document.getElementById('modalBack').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalBack').style.display = 'none';
}

async function toggleDone(id, reopenModal = false) {
  const sid = String(id);
  const t = tasks.find(x => String(x.id) === sid);
  const currentlyDone = t ? isTaskDone(t) : doneSet.has(sid);
  const nextDone = !currentlyDone;

  if (nextDone) doneSet.add(sid);
  else doneSet.delete(sid);
  if (t) t.done = nextDone;

  persist(false);
  render();
  if (reopenModal) taskDetail(sid);

  try {
    await fetch('/api/mark-submitted', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tid: getTelegramId(),
        initData: tg?.initData || '',
        content_id: sid,
        is_submitted: nextDone ? 1 : 0
      })
    });
    toast(nextDone ? 'تم تسجيل الإنجاز وإيقاف تذكيرات المهمة' : 'أعيدت المهمة إلى قائمة قيد الحل');
  } catch (e) {
    toast('تم تحديث الحالة محلياً');
  }
}

function saveNote(id) {
  const val = document.getElementById('taskNote')?.value || '';
  notes[String(id)] = val;
  persist(true);
  render();
  toast('حُفظت ملاحظتك بنجاح');
}

function downloadICS(id) {
  const t = tasks.find(x => String(x.id) === String(id));
  if (!t) return;
  const date = t.dueDateObj || new Date(Date.now() + 86400000);
  const stamp = date.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const nowStamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Mutah Student Notebook//AR',
    'BEGIN:VEVENT',
    `UID:${t.id}@mulms.mutah.edu.jo`,
    `DTSTAMP:${nowStamp}`,
    `DTSTART:${stamp}`,
    `SUMMARY:${t.title} (${t.course_name})`,
    `DESCRIPTION:${t.course_name} - ${t.type} - ${t.url}`,
    `URL:${t.url}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = `${t.id}.ics`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('تم تنزيل ملف الموعد لإضافته إلى التقويم');
}

async function syncNow() {
  if (!isLoggedIn) {
    toast('سجّل دخولك أولاً لمزامنة مقرراتك من LMS');
    go('settings');
    return;
  }
  if (isSyncing) return;
  isSyncing = true;

  const stEl = document.getElementById('syncState');
  const topBtn = document.getElementById('btnSyncTop');
  if (stEl) stEl.textContent = 'جارٍ الفحص…';
  if (topBtn) topBtn.innerHTML = '<span class="spin">↻</span>';
  toast('جارٍ فحص كافة المقررات والواجبات في LMS...');

  try {
    const res = await fetch('/api/force-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: getTelegramId(), initData: tg?.initData || '' })
    });
    const d = await res.json();
    await fetchUserData();
    if (d.success) {
      toast(d.new_items > 0 ? `اكتمل الفحص: تم رصد ${d.new_items} تحديث جديد` : 'اكتمل الفحص الفوري — جميع البيانات محدّثة');
    } else {
      toast(d.error || 'تعذر إكمال الفحص الفوري');
    }
  } catch (e) {
    toast('حدث خطأ أثناء الاتصال بالخادم');
  } finally {
    isSyncing = false;
    if (topBtn) topBtn.innerHTML = '↻';
    updateTopBar();
    if (active === 'help') render();
  }
}

function toast(s) {
  const e = document.getElementById('toast');
  if (!e) return;
  e.textContent = s;
  e.style.display = 'block';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { e.style.display = 'none'; }, 3000);
}

// Initial render & live fetch
render();
fetchUserData();
</script>
